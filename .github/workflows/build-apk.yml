name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Phiên bản lấy từ dòng "version:" trong pubspec.yaml (phần trước dấu +).
      - name: Read version
        id: ver
        run: |
          V=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Hoc Vui version: $V"

      # Sinh các file Android còn thiếu (không ghi đè file đã có trong repo,
      # ví dụ AndroidManifest.xml và biểu tượng app).
      - name: Create Android platform files
        run: flutter create --org com.hocvui --project-name hoc_vui --platforms android .

      # Firebase Auth cần minSdk 23.
      - name: Set minSdk 23
        run: |
          sed -i -E 's/minSdk *= *flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          grep -n 'minSdk' android/app/build.gradle.kts

      # flutter_local_notifications (nhắc học) cần core library desugaring.
      - name: Enable core library desugaring
        run: |
          python3 - <<'EOF'
          import re
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          if 'isCoreLibraryDesugaringEnabled' not in s:
              s, n = re.subn(r'compileOptions\s*\{', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', s, count=1)
              assert n == 1, 'compileOptions not found'
              s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              open(p, 'w').write(s)
          print('Desugaring enabled')
          EOF

      # Bật Firebase khi đã có android/app/google-services.json trong repo.
      - name: Enable Google Services plugin
        if: hashFiles('android/app/google-services.json') != ''
        run: |
          sed -i -E 's/^(\s*)id\("com\.android\.application"\) version/\1id("com.google.gms.google-services") version "4.4.2" apply false\n\1id("com.android.application") version/' android/settings.gradle.kts
          sed -i -E 's/^(\s*)id\("com\.android\.application"\)\s*$/\1id("com.android.application")\n\1id("com.google.gms.google-services")/' android/app/build.gradle.kts
          grep -q 'google-services' android/settings.gradle.kts
          grep -q 'google-services' android/app/build.gradle.kts
          echo "Google Services plugin enabled"

      - name: Warn when google-services.json is missing
        if: hashFiles('android/app/google-services.json') == ''
        run: echo "::warning::Chưa có android/app/google-services.json — app sẽ báo 'chưa cấu hình Firebase'."

      # Ký app bằng khóa cố định (secret KEYSTORE_BASE64) để bản mới cài đè
      # được lên bản cũ. Chưa có secret thì dùng khóa debug ngẫu nhiên.
      - name: Use fixed signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Chưa có secret KEYSTORE_BASE64 — APK được ký bằng khóa tạm, bản sau sẽ không cài đè được."
            exit 0
          fi
          KS="$RUNNER_TEMP/hocvui.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          KS="$KS" python3 - <<'EOF'
          import os, re
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          block = (
              '    signingConfigs {\n'
              '        create("fixed") {\n'
              '            storeFile = file("%s")\n'
              '            storePassword = "android"\n'
              '            keyAlias = "androiddebugkey"\n'
              '            keyPassword = "android"\n'
              '        }\n'
              '    }\n\n' % os.environ['KS'])
          s, n1 = re.subn(r'\n(\s*)buildTypes\s*\{', '\n' + block + r'\1buildTypes {', s, count=1)
          s, n2 = re.subn(r'signingConfigs\.getByName\("debug"\)', 'signingConfigs.getByName("fixed")', s)
          assert n1 == 1 and n2 >= 1, 'Could not patch signing config'
          open(p, 'w').write(s)
          print('Signing config patched')
          EOF

      - run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build
        run: flutter build apk --release

      # Đặt tên file kèm phiên bản, ví dụ HocVui-0.1.0.apk
      - name: Name APK with version
        run: cp build/app/outputs/flutter-apk/app-release.apk "build/HocVui-${{ steps.ver.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HocVui-${{ steps.ver.outputs.version }}
          path: build/HocVui-${{ steps.ver.outputs.version }}.apk

      - name: Show APK signature
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -m1 'SHA-1' || true
