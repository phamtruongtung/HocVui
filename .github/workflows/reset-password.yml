name: Reset password

# Đặt lại mật khẩu cho một tài khoản Học Vui (khi con hoặc phụ huynh quên mật khẩu).
# Chạy: tab Actions → Reset password → Run workflow → nhập tên đăng nhập và mật khẩu mới.
#
# Cần secret FIREBASE_SERVICE_ACCOUNT: nội dung file JSON tải ở Firebase Console →
# Project settings → Service accounts → Generate new private key.

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Tên đăng nhập (ví dụ minhan.7a)'
        required: true
      new_password:
        description: 'Mật khẩu mới (ít nhất 6 ký tự)'
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Hide password in logs
        run: echo "::add-mask::${{ github.event.inputs.new_password }}"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install firebase-admin
        working-directory: tools
        run: npm install --no-audit --no-fund firebase-admin@12

      - name: Reset password
        working-directory: tools
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          HV_USER: ${{ github.event.inputs.username }}
          HV_PASSWORD: ${{ github.event.inputs.new_password }}
        run: node reset_password.mjs
